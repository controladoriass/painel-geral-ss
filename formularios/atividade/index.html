<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Atividade Diária — Silva &amp; Silva</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../form.css">
</head>
<body>
<div class="wrap">

  <a class="back-hub" href="../">voltar aos formulários</a>

  <header class="top">
    <img class="logo" src="../logo.png" alt="Silva &amp; Silva Advogados Associados">
    <h1><span class="tick"></span>Atividade Diária</h1>
    <div class="sub">Registro rápido do dia: ligações, leads, reuniões e propostas. Leva 30 segundos.</div>
  </header>

  <form id="form" class="card" autocomplete="off">

    <div class="sec-title">Responsável e data</div>

    <div class="grid">
      <div class="field">
        <label>Data <span class="req">*</span></label>
        <input type="date" name="dataAtividade" id="dataAt" required>
      </div>

      <div class="field">
        <label>Responsável <span class="req">*</span></label>
        <input type="text" name="vendedor" required placeholder="Seu nome completo">
      </div>
    </div>

    <div class="sec-title mt">Atividade do dia</div>
    <div class="hint" style="margin:-6px 0 14px">Deixe em branco o que não fez — só preenche o que rolou. Nos "com quem", separe nomes por vírgula.</div>

    <div class="grid">
      <div class="field">
        <label>Ligações · quantidade</label>
        <input type="number" name="ligacoes" min="0" step="1" placeholder="0">
      </div>
      <div class="field">
        <label>Com quem (ligações)</label>
        <input type="text" name="ligacoesNomes" placeholder="Ex.: João Silva, Maria, Pedro Costa">
      </div>

      <div class="field">
        <label>Leads novos · quantidade</label>
        <input type="number" name="leads" min="0" step="1" placeholder="0">
      </div>
      <div class="field">
        <label>Nome dos leads</label>
        <input type="text" name="leadsNomes" placeholder="Ex.: Ana (indicação Ambev), TechCorp">
      </div>

      <div class="field">
        <label>Reuniões · quantidade</label>
        <input type="number" name="reunioes" min="0" step="1" placeholder="0">
      </div>
      <div class="field">
        <label>Com quem (reuniões)</label>
        <input type="text" name="reunioesNomes" placeholder="Ex.: Cliente XYZ, Prospect ABC">
      </div>

      <div class="field">
        <label>Propostas · quantidade</label>
        <input type="number" name="propostas" min="0" step="1" placeholder="0">
      </div>
      <div class="field">
        <label>Para quem (propostas)</label>
        <input type="text" name="propostasNomes" placeholder="Ex.: Construtora BHM, Loja Beta">
      </div>
    </div>

    <div class="grid" style="margin-top:14px">
      <div class="field full">
        <label>Observações <span class="opt">opcional</span></label>
        <textarea name="observacoes" placeholder="Destaques do dia, contatos importantes, obstáculos…"></textarea>
      </div>
    </div>

    <div class="actions">
      <button type="submit" class="submit">Registrar dia</button>
    </div>
  </form>
</div>

<script src="../form.js"></script>
<script>
window.APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzzyDRg7mQRoJRjp7sXY-r4UHpOvBuWXbQf2Bew87uOS6naMlNKwsarK9-mdXkUN1gQGw/exec";
dataHoje(document.getElementById('dataAt'));
formSetup({
  form: document.getElementById('form'),
  formId: 'atividade',
  msgOk: 'Registro salvo. Bom trabalho!',
  afterOk: ()=> dataHoje(document.getElementById('dataAt'))
});
</script>
</body>
</html>
