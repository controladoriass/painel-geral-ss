<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Metas Comerciais — Silva &amp; Silva</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../form.css">
</head>
<body>
<div class="wrap">

  <a class="back-hub" href="../">voltar aos formulários</a>

  <header class="top">
    <img class="logo" src="../logo.png" alt="Silva &amp; Silva Advogados Associados">
    <h1><span class="tick"></span>Metas Comerciais</h1>
    <div class="sub">Cadastro das metas por responsável e período.</div>
  </header>

  <form id="form" class="card" autocomplete="off">

    <div class="sec-title">Responsável e período</div>

    <div class="grid">
      <div class="field full">
        <label>Responsável <span class="req">*</span></label>
        <input type="text" name="responsavel" required placeholder="Seu nome completo">
      </div>

      <div class="field">
        <label>Período <span class="req">*</span></label>
        <select name="periodo" required>
          <option value="mes" selected>Mensal</option>
          <option value="semana">Semanal</option>
          <option value="trimestre">Trimestral</option>
        </select>
      </div>

      <div class="field">
        <label>Referência <span class="req">*</span></label>
        <input type="text" name="referencia" placeholder="Ex.: 2026-09" required>
      </div>

      <div class="field full">
        <div class="hint">Formato sugerido: <b>AAAA-MM</b> (mês) · <b>AAAA-Wnn</b> (semana) · <b>AAAA-Qn</b> (trimestre).</div>
      </div>
    </div>

    <div class="sec-title mt">Metas do período</div>

    <div class="grid">
      <div class="field">
        <label>Propostas (quantidade) <span class="opt">opcional</span></label>
        <input type="number" name="metaPropostasQtd" min="0" step="1" placeholder="Ex.: 30">
      </div>

      <div class="field">
        <label>Propostas (valor) <span class="opt">opcional</span></label>
        <div class="money">
          <span class="cur">R$</span>
          <input type="text" name="metaPropostasValor" id="metaValor" placeholder="0,00" inputmode="decimal">
        </div>
      </div>

      <div class="field">
        <label>Assessorias mensais a fechar <span class="opt">opcional</span></label>
        <input type="number" name="metaAssessorias" min="0" step="1" placeholder="Ex.: 3">
      </div>

      <div class="field">
        <label>Ligações <span class="opt">opcional</span></label>
        <input type="number" name="metaLigacoes" min="0" step="1" placeholder="Ex.: 100">
      </div>

      <div class="field full">
        <label>Leads novos <span class="opt">opcional</span></label>
        <input type="number" name="metaLeads" min="0" step="1" placeholder="Ex.: 20">
      </div>

      <div class="field full">
        <label>Observações <span class="opt">opcional</span></label>
        <textarea name="observacoes" placeholder="Contexto do período, ajustes especiais, campanhas…"></textarea>
      </div>
    </div>

    <div class="actions">
      <button type="submit" class="submit">Salvar meta</button>
    </div>
  </form>
</div>

<script src="../form.js"></script>
<script>
// COLE aqui a URL /exec do Apps Script (Parte 2 do INSTRUCOES.md).
window.APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzzyDRg7mQRoJRjp7sXY-r4UHpOvBuWXbQf2Bew87uOS6naMlNKwsarK9-mdXkUN1gQGw/exec";
mascaraMoeda(document.getElementById('metaValor'));
formSetup({
  form: document.getElementById('form'),
  formId: 'metas',
  msgOk: 'Meta salva!'
});
</script>
</body>
</html>
