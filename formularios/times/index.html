<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Times &amp; Equipes — Silva &amp; Silva</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../form.css">
</head>
<body>
<div class="wrap">

  <a class="back-hub" href="../">voltar aos formulários</a>

  <header class="top">
    <img class="logo" src="../logo.png" alt="Silva &amp; Silva Advogados Associados">
    <h1><span class="tick"></span>Times &amp; Equipes</h1>
    <div class="sub">Vincula cada advogado ao seu time. Preencher só quando muda (novo advogado ou troca de área).</div>
  </header>

  <form id="form" class="card" autocomplete="off">

    <div class="sec-title">Vínculo</div>

    <div class="grid">
      <div class="field full">
        <label>Advogado <span class="req">*</span></label>
        <input type="text" name="advogado" placeholder="Nome completo" required list="advs-list" autocomplete="off">
        <datalist id="advs-list">
          <option value="Maiko Roberto Maier">
          <option value="Kim Augusto Zanoni">
          <option value="Fernando de Liz França">
          <option value="Alexandre Ribeiro">
          <option value="Luciano Vinholi">
          <option value="José Alexandro de Miranda">
          <option value="Bruno Pinheiro Damasceno">
          <option value="Daniel Fioreze">
          <option value="Larissa Vizzotto">
          <option value="Luana Bruguer Ribeiro">
          <option value="Henrique Braun">
          <option value="Carolina Benetti">
          <option value="Alicia Camargo">
          <option value="Anita Pereira da Silveira">
          <option value="Vinicius Costa Barros">
          <option value="Graziane de Melo">
          <option value="Maria Gabriely Pereira de Lacerda">
          <option value="Juliana Coutinho Pacheco">
          <option value="Lucas Freitas Honorato de Oliveira">
          <option value="Raquel Martins de Souza">
          <option value="Eduardo Agostini Costella">
          <option value="Giovanna Julia Paulina da Silva">
          <option value="Henrique Juliano de Oliveira">
          <option value="Gabriella Ferigotti Carraro">
        </datalist>
        <div class="hint">Comece a digitar — a lista sugere os advogados ativos.</div>
      </div>

      <div class="field">
        <label>Time / Equipe <span class="req">*</span></label>
        <select name="time" required>
          <option value="" disabled selected>Selecione o time…</option>
          <option>Cível / Contencioso</option>
          <option>Trabalhista</option>
          <option>Tributário</option>
          <option>Empresarial / Societário</option>
          <option>Imobiliário</option>
          <option>Bancário</option>
          <option>Família e Sucessões</option>
          <option>Penal</option>
          <option>Consultivo</option>
          <option>Extrajudicial / Cobrança</option>
          <option>Direção</option>
          <option>Outro</option>
        </select>
      </div>

      <div class="field">
        <label>Situação</label>
        <select name="situacao">
          <option value="ativo" selected>Ativo</option>
          <option value="inativo">Inativo</option>
        </select>
      </div>

      <div class="field full">
        <label>Líder do time <span class="opt">opcional</span></label>
        <input type="text" name="lider" placeholder="Nome do líder">
      </div>

      <div class="field full">
        <label>Observações <span class="opt">opcional</span></label>
        <textarea name="observacoes" placeholder="Ex.: atuação parcial em outra área, transição de time…"></textarea>
      </div>
    </div>

    <div class="actions">
      <button type="submit" class="submit">Salvar vínculo</button>
    </div>
  </form>
</div>

<script src="../form.js"></script>
<script>
window.APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzzyDRg7mQRoJRjp7sXY-r4UHpOvBuWXbQf2Bew87uOS6naMlNKwsarK9-mdXkUN1gQGw/exec";
formSetup({
  form: document.getElementById('form'),
  formId: 'times',
  msgOk: 'Vínculo salvo!'
});
</script>
</body>
</html>
