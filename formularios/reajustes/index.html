<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reajuste de Assessoria — Silva &amp; Silva</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../form.css">
</head>
<body>
<div class="wrap">

  <a class="back-hub" href="../">voltar aos formulários</a>

  <header class="top">
    <img class="logo" src="../logo.png" alt="Silva &amp; Silva Advogados Associados">
    <h1><span class="tick"></span>Reajuste de Assessoria</h1>
  </header>

  <form id="form" class="card" autocomplete="off">

    <div class="sec-title">Contrato</div>

    <div class="grid">
      <div class="field full">
        <label>Cliente <span class="req">*</span></label>
        <input type="text" name="cliente" required placeholder="Nome do cliente">
      </div>

      <div class="field">
        <label>Nº do contrato <span class="opt">opcional</span></label>
        <input type="text" name="numeroContrato" placeholder="Ex.: 2360">
      </div>

      <div class="field">
        <label>Valor atual <span class="opt">opcional</span></label>
        <div class="money">
          <span class="cur">R$</span>
          <input type="text" name="valorAtual" id="vAtual" inputmode="decimal" placeholder="0,00">
        </div>
      </div>
    </div>

    <div class="sec-title mt">Reajuste</div>

    <div class="grid">
      <div class="field">
        <label>Data do reajuste <span class="req">*</span></label>
        <input type="date" name="dataReajuste" required>
      </div>

      <div class="field">
        <label>Índice usado <span class="opt">opcional</span></label>
        <select name="indice">
          <option value="" disabled selected>Selecione…</option>
          <option>IPCA</option>
          <option>IGP-M</option>
          <option>INPC</option>
          <option>Livre / Negociado</option>
          <option>Não se aplica</option>
        </select>
      </div>

      <div class="field">
        <label>Valor anterior <span class="req">*</span></label>
        <div class="money">
          <span class="cur">R$</span>
          <input type="text" name="valorAnterior" id="vAnt" required inputmode="decimal" placeholder="0,00">
        </div>
      </div>

      <div class="field">
        <label>Valor novo <span class="req">*</span></label>
        <div class="money">
          <span class="cur">R$</span>
          <input type="text" name="valorNovo" id="vNov" required inputmode="decimal" placeholder="0,00">
        </div>
      </div>

      <div class="field full">
        <div class="calc-box">
          <span class="cb-lbl">Variação</span>
          <span class="cb-val zero" id="calc">—</span>
        </div>
      </div>

      <div class="field">
        <label>Nova vigência (data final do contrato) <span class="opt">opcional</span></label>
        <input type="date" name="novaDataFinal">
      </div>

      <div class="field full">
        <label>Motivo <span class="opt">opcional</span></label>
        <input type="text" name="motivo" placeholder="Ex.: reajuste anual IPCA · aumento de escopo · renegociação">
      </div>

      <div class="field full">
        <label>Observações <span class="opt">opcional</span></label>
        <textarea name="observacoes" placeholder="Detalhes da negociação, aprovação, etc."></textarea>
      </div>
    </div>

    <div class="actions">
      <button type="submit" class="submit">Salvar reajuste</button>
    </div>
  </form>
</div>

<script src="../form.js"></script>
<script>
window.APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzzyDRg7mQRoJRjp7sXY-r4UHpOvBuWXbQf2Bew87uOS6naMlNKwsarK9-mdXkUN1gQGw/exec";

const vAtual = document.getElementById('vAtual');
const vAnt = document.getElementById('vAnt');
const vNov = document.getElementById('vNov');
const calc = document.getElementById('calc');
mascaraMoeda(vAtual);
mascaraMoeda(vAnt);
mascaraMoeda(vNov);

function num(v){
  if(!v) return 0;
  const n = parseFloat(String(v).replace(/\./g,'').replace(',','.'));
  return isNaN(n)?0:n;
}
function atualizarCalc(){
  const a = num(vAnt.value), n = num(vNov.value);
  if(a<=0){ calc.textContent='—'; calc.className='cb-val zero'; return; }
  const pct = (n-a)/a*100;
  const sinal = pct>0?'+':(pct<0?'':'');
  calc.textContent = sinal + pct.toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2}) + '%';
  calc.className = 'cb-val ' + (pct>0?'pos':(pct<0?'neg':'zero'));
}
vAnt.addEventListener('input', atualizarCalc);
vNov.addEventListener('input', atualizarCalc);

formSetup({
  form: document.getElementById('form'),
  formId: 'reajustes',
  msgOk: 'Reajuste registrado!',
  afterOk: () => atualizarCalc()
});
</script>
</body>
</html>
